<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#0f0f18"/>
      <stop offset="100%" style="stop-color:#111118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#ff8555"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255,107,53,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,107,53,0)"/>
    </radialGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Световое пятно по центру -->
  <circle cx="600" cy="280" r="300" fill="url(#glow)"/>
  
  <!-- ART -->
  <text x="440" y="320" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#ffffff" letter-spacing="12" text-anchor="middle">ART</text>
  
  <!-- 13 -->
  <text x="760" y="320" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="url(#accent)" letter-spacing="12" text-anchor="middle">13</text>
  
  <!-- Подзаголовок -->
  <text x="600" y="390" font-family="Arial, sans-serif" font-size="20" fill="#8a8a9a" letter-spacing="6" text-anchor="middle">EVENT-ПРОДАКШЕН ПОЛНОГО ЦИКЛА</text>
  
  <!-- Сайт -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="16" fill="#5a5a6a" letter-spacing="3" text-anchor="middle">ART13.ART</text>
</svg>
