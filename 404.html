<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART 13 — Страница не найдена</title>
    <link rel="icon" type="image/svg+xml" href="image/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16.png">
    <link rel="icon" type="image/png" sizes="512x512" href="image/favicon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .error-inner {
            text-align: center;
            max-width: 500px;
        }

        .error-code {
            font-size: clamp(80px, 15vw, 160px);
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 24px;
            letter-spacing: -4px;
        }

        .error-title {
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 700;
            margin-bottom: 16px;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        @media (max-width: 768px) {
            .error-page {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="error-page">
            <div class="error-inner">
                <div class="error-code">404</div>
                <h1 class="error-title">Страница не найдена</h1>
                <p class="error-desc">К сожалению, страница, которую вы ищете, не существует или была перемещена.</p>
            </div>
        </section>
    </main>
</body>
</html>
