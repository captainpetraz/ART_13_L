<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART 13 — Страница не найдена</title>
    <link rel="icon" type="image/svg+xml" href="image/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="image/favicon-16.png">
    <link rel="icon" type="image/png" sizes="512x512" href="image/favicon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .error-inner {
            text-align: center;
            max-width: 500px;
        }

        .error-code {
            font-size: clamp(80px, 15vw, 160px);
            font-weight: 900;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 24px;
            letter-spacing: -4px;
        }

        .error-title {
            font-size: clamp(20px, 3vw, 28px);
            font-weight: 700;
            margin-bottom: 16px;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            font-family: var(--font);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .error-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.3);
        }

        .error-btn svg {
            transition: transform 0.3s;
        }

        .error-btn:hover svg {
            transform: translateX(-4px);
        }

        @media (max-width: 768px) {
            .error-page {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="error-page">
            <div class="error-inner">
                <div class="error-code">404</div>
                <h1 class="error-title">Страница не найдена</h1>
                <p class="error-desc">К сожалению, страница, которую вы ищете, не существует или была перемещена.</p>
                <a href="index.html" class="error-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    На главную
                </a>
            </div>
        </section>
    </main>
</body>
</html>
