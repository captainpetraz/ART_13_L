<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор фавиконов ART 13</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
        }
        h1 { margin-bottom: 30px; }
        .preview {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .preview-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        canvas {
            border: 1px solid #333;
            image-rendering: pixelated;
        }
        .btn {
            padding: 14px 32px;
            background: #E30613;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin: 5px;
        }
        .btn:hover { background: #ff1a29; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #status { margin-top: 20px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <h1>Генератор фавиконов ART 13</h1>
    <div class="preview" id="preview"></div>
    <button class="btn" id="generateBtn" onclick="generate()">Скачать все фавиконы</button>
    <div id="status">Нажмите кнопку для генерации</div>

    <script>
        const sizes = [16, 32, 48, 180, 512];
        const colors = {
            bg: '#E30613',
            text: '#FFFFFF'
        };

        function drawFavicon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Rounded rect
            const r = size * 0.1875; // 96/512
            ctx.beginPath();
            ctx.moveTo(r, 0);
            ctx.lineTo(size - r, 0);
            ctx.quadraticCurveTo(size, 0, size, r);
            ctx.lineTo(size, size - r);
            ctx.quadraticCurveTo(size, size, size - r, size);
            ctx.lineTo(r, size);
            ctx.quadraticCurveTo(0, size, 0, size - r);
            ctx.lineTo(0, r);
            ctx.quadraticCurveTo(0, 0, r, 0);
            ctx.closePath();
            ctx.fillStyle = colors.bg;
            ctx.fill();

            // "13" text
            const fontSize = Math.floor(size * 0.625); // 320/512
            ctx.font = `900 ${fontSize}px "Arial Black", Impact, sans-serif`;
            ctx.fillStyle = colors.text;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('13', size / 2, size / 2 + size * 0.06);

            return canvas;
        }

        function renderPreviews() {
            const preview = document.getElementById('preview');
            sizes.forEach(size => {
                const item = document.createElement('div');
                item.className = 'preview-item';

                const displaySize = Math.min(size, 120);
                const canvas = drawFavicon(size);
                const scaled = document.createElement('canvas');
                scaled.width = displaySize;
                scaled.height = displaySize;
                scaled.style.width = displaySize + 'px';
                scaled.style.height = displaySize + 'px';
                scaled.getContext('2d').drawImage(canvas, 0, 0, displaySize, displaySize);

                const label = document.createElement('span');
                label.style.fontSize = '12px';
                label.style.color = '#aaa';
                label.textContent = `${size}×${size}`;

                item.appendChild(scaled);
                item.appendChild(label);
                preview.appendChild(item);
            });
        }

        function generate() {
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.textContent = 'Генерация...';

            const output = [];

            sizes.forEach(size => {
                const canvas = drawFavicon(size);
                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');

                    let filename;
                    if (size === 16) filename = 'favicon-16.png';
                    else if (size === 32) filename = 'favicon-32.png';
                    else if (size === 180) filename = 'apple-touch-icon.png';
                    else if (size === 512) filename = 'favicon-512.png';
                    else return; // skip 48

                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    output.push(filename);
                    status.textContent = `Скачано: ${output.join(', ')}`;

                    if (output.length >= 4) {
                        btn.disabled = false;
                        status.textContent = '✅ Готово! Все фавиконы скачаны.';
                    }
                }, 'image/png');
            });
        }

        renderPreviews();
    </script>
</body>
</html>
